# Read last, every time the game starts, after user.cfg and settings.cfg.
# Anything set here therefore wins, which is the point: the camera has to
# look the same on a fresh install as it does on a machine that has been
# played on for months. A player who wants their own values puts an
# autoexec.cfg in their var directory - that one is read after this one.

# View from behind the cycle.
CAMERA_CUSTOM_RISE 34
CAMERA_CUSTOM_BACK 44
CAMERA_CUSTOM_PITCH -0.7

# View while glancing to the side.
CAMERA_GLANCE_RISE 53
CAMERA_GLANCE_BACK 58
CAMERA_GLANCE_PITCH -0.75

START_FOV_1 50

# The rim carries a banner four hundred units long rather than a tile a
# hundred across, so one pass of it wraps most of an arena instead of
# repeating seven times. The texture is cut to match; change one and the
# other stops fitting.
RIM_WALL_STRETCH_X 400

# Win zone appearance.
ZONE_SEG_LENGTH 0.2
ZONE_HEIGHT 0.5
ZONE_SEGMENTS 22
ZONE_ALPHA 0.2

MAX_IN_RATE 512
MAX_OUT_RATE 512

AXES_INDICATOR 1
