# Mazing Training - solo practice.
# Physics copied from the competitive server export so turns, rubber and
# wall length behave exactly as they do online.

TRAINING_MODE 1

# Rubber is made more effective by ping, so offline the same trick dies a hair
# earlier. Pretend to have the connection you practise for, in seconds.
TRAINING_PING 0.05

# Freestyle never awards a win for surviving, and the round only ends when
# the grid empties - which instant respawn prevents.
SP_GAME_TYPE 0
SP_NUM_AIS 0
SP_AUTO_AIS 0
SP_AUTO_IQ 0
SP_MIN_PLAYERS 1

# The match end test uses >=, so zero would resolve on the first frame.
SP_LIMIT_TIME 100000
LIMIT_TIME 100000
SP_LIMIT_ROUNDS 100000
LIMIT_ROUNDS 100000
SP_LIMIT_SCORE 100000
LIMIT_SCORE 100000

# Single player keeps its own copy of these, and it is the one that counts.
